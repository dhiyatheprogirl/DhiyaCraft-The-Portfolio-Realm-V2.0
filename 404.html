<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unloaded Chunk — DhiyaCraft</title>
<meta name="description" content="404 — You wandered into an unloaded chunk of DhiyaCraft: The Portfolio Realm.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --grass: #5C913B;
    --stone: #2D2D2D;
    --bg: #121212;
    --xp-green: #7CFC00;
    --paper: #ead9ad;
    --font-pixel: 'Press Start 2P', monospace;
    --font-mc: 'VT323', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background:
      linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.75)),
      repeating-linear-gradient(90deg, #1a1a1a 0 32px, #141414 32px 64px);
    color: #e9e6dc;
    font-family: var(--font-mc);
    display: flex; align-items: center; justify-content: center;
    text-align: center;
    overflow: hidden;
  }
  .chunk-wrap { padding: 24px; max-width: 560px; }
  .void-grid {
    position: fixed; inset: 0; z-index: -1;
    background-image:
      linear-gradient(rgba(124,252,0,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(124,252,0,0.04) 1px, transparent 1px);
    background-size: 32px 32px;
    animation: drift-grid 30s linear infinite;
  }
  @keyframes drift-grid { from { background-position: 0 0; } to { background-position: 200px 200px; } }

  .steve {
    font-size: 64px;
    filter: brightness(0) opacity(0.55);
    margin-bottom: 10px;
    animation: bob 2s ease-in-out infinite;
  }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

  .bridge {
    width: 220px; height: 8px; margin: 18px auto 30px;
    background: repeating-linear-gradient(90deg, #6b4520 0 18px, transparent 18px 26px);
    position: relative;
  }
  .bridge::after {
    content: '';
    position: absolute; left: 50%; top: 0; bottom: 0; width: 40px;
    background: var(--bg);
    transform: translateX(-50%);
  }

  h1 {
    font-family: var(--font-pixel);
    font-size: clamp(16px, 4vw, 24px);
    color: var(--xp-green);
    text-shadow: 3px 3px 0 rgba(0,0,0,0.6);
    margin-bottom: 18px;
    letter-spacing: 2px;
  }
  .error-code {
    font-family: var(--font-pixel);
    font-size: 12px;
    color: var(--paper);
    margin-bottom: 14px;
    opacity: 0.8;
  }
  p.desc { font-size: 20px; color: #b8b3a4; margin-bottom: 30px; line-height: 1.5; }

  .mc-btn {
    font-family: var(--font-pixel); font-size: 11px; color: #fff; background: var(--grass);
    border: none; padding: 16px 24px; display: inline-flex; align-items: center; gap: 10px;
    box-shadow: inset 3px 3px 0 rgba(255,255,255,0.3), inset -4px -4px 0 rgba(0,0,0,0.35), 0 5px 0 rgba(0,0,0,0.45);
    transition: transform 0.12s ease;
    text-decoration: none;
    cursor: pointer;
  }
  .mc-btn:hover { transform: translateY(-3px); }
  .mc-btn:active { transform: translateY(2px); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
  <div class="void-grid" aria-hidden="true"></div>
  <div class="chunk-wrap">
    <span class="steve" aria-hidden="true">🧍</span>
    <div class="bridge" aria-hidden="true"></div>
    <p class="error-code">ERROR 404</p>
    <h1>You wandered into an unloaded chunk.</h1>
    <p class="desc">This part of DhiyaCraft hasn't been generated yet. The bridge ends here — best to turn back before you fall into the void.</p>
    <a href="index.html" class="mc-btn">
      <span aria-hidden="true">🏠</span> Return Home
    </a>
  </div>
</body>
</html>
